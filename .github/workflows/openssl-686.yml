# One-off probe: does issue #686 (cl+ssl crashes after objc-support is loaded) happen on
# Apple Silicon too?  Runs the crash repro from the issue against the released 1.14 binaries
# on an Intel mac (control) and an Apple Silicon mac, with and without objc-support.
name: Issue 686 on Intel and Apple Silicon

on:
  push:
    branches: [ci-openssl-686]

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            tarball: ccl-1.14-darwinx86.tar.gz
            kernel: dx86cl64
          - runner: macos-latest
            tarball: ccl-1.14-darwinarm64.tar.gz
            kernel: darm64cl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CCL: ${{ github.workspace }}/ccl/${{ matrix.kernel }}
    steps:
      - name: Install released ccl 1.14 and Quicklisp
        run: |
          curl -sSfL -O https://github.com/Clozure/ccl/releases/download/v1.14/${{ matrix.tarball }}
          tar -xzf ${{ matrix.tarball }}
          uname -m
          curl -sSfL -O https://beta.quicklisp.org/quicklisp.lisp
          $CCL -n -b -l quicklisp.lisp -e '(quicklisp-quickstart:install)' -e '(quit)'
          # Download and compile cl+ssl once, so the runs below only load it.
          $CCL -n -b -e '(load "~/quicklisp/setup.lisp")' -e '(ql:quickload :cl+ssl)' -e '(quit)'

      - name: cl+ssl without objc-support (control)
        run: |
          $CCL -n -b -e '(load "~/quicklisp/setup.lisp")' -e '(ql:quickload :cl+ssl)' \
               -e '(cl+ssl:ensure-initialized)' -e '(format t "~&CL+SSL-INIT-OK~%")' -e '(quit)' \
               < /dev/null > plain.log 2>&1 || echo "exit status $?"
          cat plain.log
          grep -q CL+SSL-INIT-OK plain.log

      # In batch mode the crash kills ccl with SIGSEGV (exit 139) without printing anything.
      - name: cl+ssl after objc-support (the issue 686 repro)
        timeout-minutes: 5
        run: |
          status=0
          $CCL -n -b -e "(require 'objc-support)" -e '(load "~/quicklisp/setup.lisp")' -e '(ql:quickload :cl+ssl)' \
               -e '(cl+ssl:ensure-initialized)' -e '(format t "~&CL+SSL-INIT-OK~%")' -e '(quit)' \
               < /dev/null > objc.log 2>&1 || status=$?
          cat objc.log
          echo "exit status $status"
          if grep -q CL+SSL-INIT-OK objc.log; then
            echo "::notice::${{ matrix.runner }}: no crash with objc-support (bug absent)"
          elif [ $status -eq 139 ]; then
            echo "::warning::${{ matrix.runner }}: SIGSEGV with objc-support (bug present)"
          else
            echo "::error::${{ matrix.runner }}: neither finished nor segfaulted (exit $status); see objc.log"
            exit 1
          fi

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.runner }}
          path: "*.log"
